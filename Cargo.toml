[package]
name = "damsels"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
# NOTE: dev is default for local development. Remove before production!
default = ["dev"]
# Development features - NEVER enable in production builds
# Enables: ActivityAdmin role, admin reducers for activity management
dev = []

[dependencies]
spacetimedb = "1.0"
log = "0.4"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true

